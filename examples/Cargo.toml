[package]
name = "x509-validator-examples"
version = "0.0.0"
edition = "2021"
description = "Runnable examples for x509-validator. Not published."
publish = false

[lints]
workspace = true

[dependencies]
x509-validator = { workspace = true, features = ["aws_lc"] }

# Certificates to validate. The examples that need a chain shaped a particular
# way generate one; the rest read real DER from `mocks/`.
rcgen.workspace = true

# The platform trust store, for the examples that validate against the public
# web PKI. This is where a real application gets its roots.
rustls-native-certs = "0.8"

# `x5c` chains arrive base64-encoded inside a JWS header.
base64 = "0.22"

# Backs the `custom_crypto_backend` example. Not a dependency of
# x509-validator itself — the point of that example is that a backend is
# something a caller supplies, from whichever library they already link.
openssl = "0.10"

[[example]]
name = "apple_x5c"
path = "apple_x5c.rs"

[[example]]
name = "webpki"
path = "webpki.rs"

[[example]]
name = "client_certificate"
path = "client_certificate.rs"

[[example]]
name = "pinned_root"
path = "pinned_root.rs"

[[example]]
name = "diagnostics"
path = "diagnostics.rs"

[[example]]
name = "custom_crypto_backend"
path = "custom_crypto_backend.rs"
