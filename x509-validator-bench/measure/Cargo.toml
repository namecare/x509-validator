[package]
name = "x509-validator-bench-measure"
version = "0.0.0"
edition = "2021"
description = "Regression benchmarks for x509-validator, mirroring the reference validator benchmark. Not published."
publish = false

[dependencies]
x509-validator = { path = "../../x509-validator" }
x509-validator-testkit = { path = "../../x509-validator-testkit" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
    "html_reports",
    "plotters",
] }

[features]
default = ["aws_lc"]
aws_lc = ["x509-validator/aws_lc"]
ring = ["x509-validator/ring"]
rust_crypto = ["x509-validator/rust_crypto"]

[lib]
bench = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "validator"
harness = false

[[bench]]
name = "policies"
harness = false
