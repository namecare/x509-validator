[package]
name = "x509-validator-bench-compare"
version = "0.0.0"
edition = "2021"
description = "Comparison benchmarks for x509-validator: backend against backend, parser against parser. Not published."
publish = false

[dependencies]
x509-validator = { path = "../../x509-validator", features = ["aws_lc", "ring", "rust_crypto"] }
x509-validator-core = { path = "../../x509-validator-core" }
x509-validator-testkit = { path = "../../x509-validator-testkit" }
# rcgen cannot generate RSA keys, so the RSA entries in the signature corpus
# need an RNG of their own.
rsa = "0.9.10"
rand = "0.8"
time = "0.3"

[dev-dependencies]
divan = "0.1.21"
# The rival parser. Our own `Certificate` is a re-export of x509-parser's, so
# x509-cert is the only genuinely external parser in the comparison.
x509-cert = "0.3.0"
der = "0.8"

[features]
default = ["aws_lc", "ring", "rust_crypto"]
aws_lc = ["x509-validator/aws_lc"]
ring = ["x509-validator/ring"]
rust_crypto = ["x509-validator/rust_crypto"]

[[bench]]
name = "crypto_atomic"
harness = false

[[bench]]
name = "parsers"
harness = false

[[bench]]
name = "backends"
harness = false
