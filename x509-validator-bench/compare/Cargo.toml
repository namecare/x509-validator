[package]
name = "x509-validator-bench-compare"
version = "0.0.0"
edition = "2021"
description = "Comparison benchmarks for x509-validator: backend against backend, parser against parser. Not published."
publish = false

[lints]
workspace = true

[dependencies]
x509-validator = { workspace = true, features = ["aws_lc", "ring", "rust_crypto"] }
x509-validator-testkit.workspace = true
rsa.workspace = true
rand.workspace = true

[dev-dependencies]
divan = "0.1.21"
x509-cert = "0.3.0"
der = "0.8.1"

[features]
default = ["aws_lc", "ring", "rust_crypto"]
aws_lc = ["x509-validator/aws_lc"]
ring = ["x509-validator/ring"]
rust_crypto = ["x509-validator/rust_crypto"]

[[bench]]
name = "crypto_atomic"
harness = false

[[bench]]
name = "parsers"
harness = false

[[bench]]
name = "backends"
harness = false
