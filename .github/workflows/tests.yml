name: Tests

# `x509-validator` has no default crypto backend: without a feature flag the
# crate compiles but verifies nothing. Each backend is therefore its own
# matrix entry rather than one `--all-features` run — `--all-features` would
# compile all three and prove only that they coexist, not that any one of
# them works alone, which is how downstream users actually depend on them.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A superseded push has nothing left to prove; cancel it and test the tip.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces cost nothing until a test panics, and a bare assertion line
  # from a runner you cannot log into is rarely enough to diagnose one.
  RUST_BACKTRACE: 1

jobs:
  backends:
    name: ${{ matrix.backend }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [aws_lc, ring, rust_crypto]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keyed per backend: the three feature sets pull in disjoint dependency
      # trees, so sharing one cache entry would thrash it on every job.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}-${{ matrix.os }}

      # aws-lc-sys builds vendored C and needs nasm to assemble its x86_64
      # routines on Windows; the other two runners have a working toolchain
      # already. cmake is present on all GitHub-hosted images.
      - name: Install nasm
        if: matrix.backend == 'aws_lc' && runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Test
        run: cargo test -p x509-validator --features ${{ matrix.backend }} --all-targets

      - name: Doctests
        run: cargo test -p x509-validator --features ${{ matrix.backend }} --doc
