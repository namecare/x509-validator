[package]
name = "x509-validator"
version = "0.0.1"
edition = "2021"
description = "X.509 certificate chain validation with RFC 5280 and server-identity policies, built on x509-validator-core."
repository = "https://github.com/namecare/x509-validator"
homepage = "https://github.com/namecare/x509-validator"
authors = ["tkhp", "namecare"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/x509-validator"
categories = ["network-programming", "cryptography"]
keywords = ["crypto", "x509"]

[dependencies]
x509-validator-core = { path = "../x509-validator-core" }
thiserror = "1"

# Cryptography - AWS-LC backend (optional)
aws-lc-rs = { version = "1.17.3", optional = true }
aws-lc-sys = { version = "0.43.0", optional = true }

# Cryptography - Ring backend (optional)
ring = { version = "0.17.14", optional = true }

# Cryptography - RustCrypto backend (optional)
rsa = { version = "0.9.10", optional = true }
p256 = { version = "0.13.2", features = ["ecdsa"], optional = true }
p384 = { version = "0.13.1", features = ["ecdsa"], optional = true }
ed25519-dalek = { version = "2.2.0", optional = true }
sha1 = { version = "0.10.7", features = ["oid"], optional = true }
sha2 = { version = "0.10.9", features = ["oid"], optional = true }
signature = { version = "2.2.0", optional = true }

[dev-dependencies]
x509-validator-testkit = { path = "../x509-validator-testkit" }
# The RSA tests in the rust_crypto backend generate a key pair, which rcgen
# cannot do for RSA; `rand` supplies the RNG `rsa` needs for that.
rand = "0.8"

[features]
aws_lc = ["dep:aws-lc-rs", "dep:aws-lc-sys"]
ring = ["dep:ring"]
rust_crypto = [
    "dep:rsa",
    "dep:p256",
    "dep:p384",
    "dep:ed25519-dalek",
    "dep:sha1",
    "dep:sha2",
    "dep:signature",
]

# All X.509 types must come from core, never from `x509-parser` directly.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "x509_validator_core::*",
]
