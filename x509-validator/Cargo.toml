[package]
name = "x509-validator"
version = "0.1.0"
edition = "2021"
description = "X.509 certificate chain validation with RFC 5280 and server-identity policies, built on x509-validator-core."
repository = "https://github.com/namecare/x509-validator"
homepage = "https://github.com/namecare/x509-validator"
authors = ["tkhp", "namecare"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/x509-validator"
categories = ["network-programming", "cryptography"]
keywords = ["crypto", "x509"]

[dependencies]
x509-validator-core = { path = "../x509-validator-core" }
x509-parser = "0.18.1"
oid-registry = "0.8.1"
thiserror = "1"
aws-lc-rs = { version = "1.17.3", optional = true }
aws-lc-sys = { version = "0.43.0", optional = true }

[dev-dependencies]
rcgen = "0.14.8"
time = "0.3"

[features]
aws_lc = ["dep:aws-lc-rs", "dep:aws-lc-sys"]
