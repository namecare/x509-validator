[package]
name = "x509-validator"
version = "0.3.0"
edition.workspace = true
rust-version = "1.88"
description = "X.509 certificate chain validation with RFC 5280 and server-identity policies."
repository = "https://github.com/namecare/x509-validator"
homepage = "https://github.com/namecare/x509-validator"
authors = ["tkhp", "namecare"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
documentation = "https://docs.rs/x509-validator"
categories = ["network-programming", "cryptography"]
keywords = ["crypto", "x509"]
autobenches = false
exclude = ["tests/**"]

[lints]
workspace = true

[dependencies]
x509-parser.workspace = true
thiserror.workspace = true

# Cryptography - AWS-LC backend (optional)
aws-lc-rs = { workspace = true, optional = true }
aws-lc-sys = { workspace = true, optional = true }

# Cryptography - Ring backend (optional)
ring = { workspace = true, optional = true }

# Cryptography - RustCrypto backend (optional)
rsa = { workspace = true, optional = true }
p256 = { workspace = true, features = ["ecdsa"], optional = true }
p384 = { workspace = true, features = ["ecdsa"], optional = true }
ed25519-dalek = { workspace = true, optional = true }
sha1 = { workspace = true, features = ["oid"], optional = true }
sha2 = { workspace = true, features = ["oid"], optional = true }
signature = { workspace = true, optional = true }

[dev-dependencies]
x509-validator-testkit.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
rsa = { workspace = true, features = ["hazmat"] }

[features]
aws_lc = ["dep:aws-lc-rs", "dep:aws-lc-sys"]
ring = ["dep:ring"]
rust_crypto = [
  "dep:rsa",
  "dep:p256",
  "dep:p384",
  "dep:ed25519-dalek",
  "dep:sha1",
  "dep:sha2",
  "dep:signature",
]

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["x509_parser::*", "asn1_rs", "asn1_rs::*", "oid_registry", "der_parser"]
